<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — ARClass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="/style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:var(--bg);background-image:radial-gradient(ellipse 700px 500px at 50% 50%,rgba(124,58,237,.1),transparent)}
.auth-box{width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo .icon{width:52px;height:52px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.auth-logo h1{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.auth-logo p{font-size:13px;color:var(--text2);margin-top:4px}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px}
.auth-tabs{display:flex;gap:0;background:var(--bg3);border-radius:8px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:none;font-family:var(--font)}
.auth-tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.demo-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:20px;font-size:12px}
.demo-box p{color:var(--text2);margin-bottom:8px;font-weight:600}
.demo-row{display:flex;justify-content:space-between;margin-bottom:4px;font-family:var(--mono);font-size:11px}
.demo-row span:first-child{color:var(--text3)}
.demo-row span:last-child{color:var(--acc)}
.quick-fill{display:flex;gap:8px;margin-top:10px}
.btn-quick{flex:1;padding:6px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:var(--font);transition:all .15s}
.btn-quick:hover{border-color:var(--acc);color:var(--acc)}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="auth-box">
  <div class="auth-logo">
    <div class="icon">📡</div>
    <h1>ARClass</h1>
    <p>AR Classroom Attendance System</p>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="setRole('faculty',this)">Faculty</button>
      <button class="auth-tab" onclick="setRole('student',this)">Student</button>
    </div>
    <div class="demo-box">
      <p>Demo credentials</p>
      <div class="demo-row"><span>Email</span><span id="demoEmail">faculty@demo.com</span></div>
      <div class="demo-row"><span>Password</span><span>password</span></div>
      <div class="quick-fill">
        <button class="btn-quick" onclick="quickFill()">⚡ Auto Fill</button>
        <button class="btn-quick" onclick="window.location='/signup'">Create Account</button>
      </div>
    </div>
    <div class="err" id="errMsg"></div>
    <div class="form-group">
      <label>Email</label>
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="off">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="••••••••" autocomplete="off">
      </div>
    </div>
    <button class="btn btn-primary w100" id="loginBtn" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text2)">
      No account? <a href="/signup" style="color:var(--acc)">Sign up</a>
    </p>
  </div>
</div>
<div class="toast-container" id="toasts"></div>
<script>
let currentRole = 'faculty';
const demos = {faculty:{email:'faculty@demo.com',pass:'password'},student:{email:'student@demo.com',pass:'password'}};

function setRole(role,tab){
  currentRole=role;
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('demoEmail').textContent=demos[role].email;
}
function quickFill(){
  document.getElementById('email').value=demos[currentRole].email;
  document.getElementById('password').value=demos[currentRole].pass;
}
async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showErr('Please fill in all fields');return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password}),credentials:'include'});
    const data=await res.json();
    if(!res.ok){showErr(data.error||'Login failed');btn.disabled=false;btn.textContent='Sign In';return;}
    showToast('✅ Welcome back, '+data.user.name+'!','success');
    setTimeout(()=>{window.location=data.user.role==='faculty'?'/dashboard':'/student';},600);
  }catch(e){showErr('Server error — is the server running?');btn.disabled=false;btn.textContent='Sign In';}
}
function showErr(msg){const el=document.getElementById('errMsg');el.textContent=msg;el.style.display='block';}
function showToast(msg,type=''){
  const t=document.createElement('div');t.className=`toast toast-${type}`;
  t.innerHTML=`<span class="toast-icon">${type==='success'?'✅':'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
