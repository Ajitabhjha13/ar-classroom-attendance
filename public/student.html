<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Check-In</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/student.css">
</head>
<body>

  <header class="topbar">
    <h1>AR Classroom Attendance</h1>
    <span class="subtitle">Student Check-In</span>
  </header>

  <main class="student-main">

    <div class="checkin-card">
      <h2>Select Your Name</h2>
      <select id="studentSelect">
        <option value="">-- Choose your name --</option>
      </select>

      <h2>Select Your Seat</h2>
      <div id="studentSeatGrid" class="seat-grid"></div>

      <button id="checkinBtn" disabled>Check In</button>
      <p id="checkinMessage"></p>
    </div>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
