<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Faculty Signup - AR Classroom Attendance</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/toast.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">🎓 Faculty Signup</h1>
      <p class="auth-subtitle">Create your faculty account</p>

      <form id="signupForm">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="e.g. Dr.Vijay Sharma" autocomplete="off">

        <label>Username</label>
        <input type="text" id="username" required placeholder="Choose a username" autocomplete="off">

        <label>Password</label>
        <input type="password" id="password" required placeholder="Choose a password">

        <button type="submit">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/faculty-login">Log in</a></p>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const res = await fetch('/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, username, password, role: 'faculty' })
      });
      const data = await res.json();

      if (data.success) {
        showToast('Account created! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = '/faculty-login', 1500);
      } else {
        showToast(data.error || 'Signup failed', 'error');
      }
    });
  </script>
</body>
</html>
